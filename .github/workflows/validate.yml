name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned so validation results are reproducible; bump deliberately.
  CLAUDE_CODE_VERSION: "2.1.295"
  CODEX_VERSION: "0.160.0"
  BUN_VERSION: "1.3.13"
  OPENCODE_VERSION: "1.19.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Test skill consolidation
        run: python3 -I tools/test_consolidate_skills.py

      - name: Check provenance hashes and manifest versions
        run: python3 -I tools/check_sources.py

      - name: Validate marketplace manifest
        run: claude plugin validate --strict .

      - name: Validate plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json

      - name: Install from the local marketplace
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          claude plugin marketplace add ./
          claude plugin install nextflow@nextflow-plugin
          claude plugin details nextflow@nextflow-plugin | tee details.txt
          expected=$(ls skills | wc -l)
          grep -q "Skills (${expected})" details.txt
          grep -q "MCP servers (1)  seqera" details.txt

      - name: Install with Codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: |
          npm install -g "@openai/codex@${CODEX_VERSION}"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add ./
          codex plugin add nextflow@nextflow-plugin
          codex plugin list | tee codex-plugins.txt
          grep -q "nextflow@nextflow-plugin  installed, enabled" codex-plugins.txt
          codex mcp list | tee codex-mcp.txt
          grep -q "seqera  https://mcp.seqera.io/mcp" codex-mcp.txt
          expected=$(ls skills | wc -l)
          actual=$(codex debug prompt-input "hi" | grep -o "nextflow:[a-z0-9-]*" | sort -u | wc -l)
          test "$actual" -eq "$expected"

  opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Typecheck, test and pack opencode-nextflow
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun test
          npm pack --dry-run

      - name: Load the plugin in a scratch project
        run: |
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          mkdir -p "${{ runner.temp }}/e2e"
          cd "${{ runner.temp }}/e2e"
          printf '{"plugin":["file:%s"]}' "$GITHUB_WORKSPACE" > "${{ runner.temp }}/e2e/opencode.json"
          opencode debug config > "${{ runner.temp }}/e2e/config.json"
          opencode debug skill > "${{ runner.temp }}/e2e/skills.txt"
          grep -q "build-nextflow-pipeline" "${{ runner.temp }}/e2e/skills.txt"
          python3 - "${{ runner.temp }}/e2e/config.json" <<'EOF'
          import json, os, sys
          text = open(sys.argv[1]).read()
          cfg = json.loads(text[text.index("{"):])
          assert cfg["mcp"]["seqera"] == {"type": "remote", "url": "https://mcp.seqera.io/mcp"}, cfg.get("mcp")
          repo_skills = os.path.join(os.environ["GITHUB_WORKSPACE"], "skills")
          expected = len([d for d in os.listdir(repo_skills) if os.path.isdir(os.path.join(repo_skills, d))])
          actual = len([p for p in cfg["skills"]["paths"] if p.startswith(repo_skills)])
          assert actual == expected, f"{actual} != {expected}"
          print(f"opencode plugin OK: {actual} skills, seqera MCP registered")
          EOF
